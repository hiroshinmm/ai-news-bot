name: Daily AI News Collection and Deploy
on:
  push:
    branches: [ main ]
  schedule:
    # 毎朝7:00 JSTに実行 (UTCで前日22:00)
    - cron: '0 22 * * *'
  # 手動実行用トリガー
  workflow_dispatch:

# GitHub Pagesデプロイに必要な権限を付与
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run News Collector Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: node backend/index_github.js

      - name: Build Frontend (Vite)
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHubは「60日間リポジトリに活動がない」とscheduleトリガーを自動停止する。
      # 実際に2026-07-07を最後に配信が止まったため、定期的に空コミットを打って活動を維持する。
      - name: Keep schedule trigger alive
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST_COMMIT_TS ) / 86400 ))
          echo "Days since last commit: ${AGE_DAYS}"
          if [ "${AGE_DAYS}" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent schedule deactivation"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Repository is still active. Skipping keepalive commit."
          fi
